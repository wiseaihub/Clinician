<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with WISE Doctor gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Medical cross -->
  <rect x="20" y="12" width="8" height="24" fill="#ffffff" rx="1"/>
  <rect x="12" y="20" width="24" height="8" fill="#ffffff" rx="1"/>
  
  <!-- WC text -->
  <text x="24" y="42" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
        text-anchor="middle" fill="url(#textGradient)">WC</text>
</svg>