<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with healthcare gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Medical cross -->
  <rect x="13" y="8" width="6" height="16" fill="url(#iconGradient)" rx="0.5"/>
  <rect x="8" y="13" width="16" height="6" fill="url(#iconGradient)" rx="0.5"/>
  
  <!-- Stethoscope head -->
  <circle cx="16" cy="10" r="2" fill="none" stroke="url(#iconGradient)" stroke-width="1.5"/>
  
  <!-- Stethoscope tubing -->
  <path d="M16 12 Q13 14 10 16 Q7 18 4 20" fill="none" stroke="url(#iconGradient)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- WC text -->
  <text x="16" y="28" font-family="Arial, sans-serif" font-size="6" font-weight="bold" 
        text-anchor="middle" fill="#1e40af">WC</text>
</svg>
