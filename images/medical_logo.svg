<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with healthcare gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Medical cross -->
  <rect x="20" y="12" width="8" height="24" fill="url(#iconGradient)" rx="1"/>
  <rect x="12" y="20" width="24" height="8" fill="url(#iconGradient)" rx="1"/>
  
  <!-- Stethoscope head -->
  <circle cx="24" cy="16" r="3" fill="none" stroke="url(#iconGradient)" stroke-width="2"/>
  
  <!-- Stethoscope tubing -->
  <path d="M24 19 Q20 22 16 25 Q12 28 8 32" fill="none" stroke="url(#iconGradient)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- WC text -->
  <text x="24" y="42" font-family="Arial, sans-serif" font-size="8" font-weight="bold" 
        text-anchor="middle" fill="#1e40af">WC</text>
</svg>
